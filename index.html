/* ── scope input: FORM = drag orbit · pinch zoom; other modes keep tap = next mode · hold = persist ── */
(function(){
  const cv=CN.out, ptr=new Map();
  let lpT=null,moved=false,multi=false,sx=0,sy=0,pinch0=0,zoom0=1;
  const isF=()=>SCOPE_MODES[scopeMode]==='FORM';
  // Zero-allocation distance check to reduce GC stutter during fast pinch-zoom
  const pdist = () => {
    const it = ptr.values();
    const a = it.next().value;
    const b = it.next().value;
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(er){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1&&isF()&&playMode){ moved=true; multi=false; sx=e.clientX; sy=e.clientY; playDown(e); return; }
    if(playing&&ptr.size===2) playUp();
    if(ptr.size===1){ moved=false; multi=false; sx=e.clientX; sy=e.clientY;
      lpT=setTimeout(()=>{ lpT=null; if(isF()) return; toggleScopePersist(); drawOut(); },500); }
    else if(ptr.size===2){ multi=true; moved=true; pinch0=pdist(); zoom0=view.zoom; if(lpT){ clearTimeout(lpT); lpT=null; } }
  },{passive:false});
  cv.addEventListener('pointermove',e=>{
    const p=ptr.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(playing&&ptr.size===1){ playMove(e); return; }

    if(!moved && (Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8)){
      moved=true;
      if(lpT){ clearTimeout(lpT); lpT=null; }
    }
    if(!isF()) return;
    if(ptr.size===1){ if(moved){ view.yaw+=dx*0.012; view.pit=cl(view.pit+dy*0.012,-1.45,1.45); formDirty=true; touchT=performance.now(); } }
    else if(ptr.size===2&&pinch0>0){ view.zoom=cl(zoom0*pdist()/pinch0,0.4,4); formDirty=true; touchT=performance.now(); }
  });
  cv.addEventListener('pointerup',e=>{ const was=lpT!==null; if(lpT){ clearTimeout(lpT); lpT=null; }
    if(playing){ ptr.delete(e.pointerId); playUp(); return; }
    ptr.delete(e.pointerId);
    if(was&&!moved&&!multi&&ptr.size===0) cycleScope(); });

})();

/* ═════════════ PLAY — touch the sculpture and it sounds like that spot ═════════════
   The spot under the finger gives a pitch, a brightness and a character (even share or noise depth). The sound is
   built the other way round from how FORM measures it: harmonics tilted until their centroid lands at that brightness,
   even/odd balanced to the even share, and noise added until the spectrum is as flat as the spot says. The finger
   never covers the target: the aim ring sits a little above it. */
const AIM_OFF=46;                                   // css px above the finger
const BW={N:4096,sw:0,sw2:0,lobe:null};             // the analyser's Blackman window: main-lobe shape and sums, built once
function bwInit(){
  if(BW.lobe) return;
  const N=BW.N, w=new Float64Array(N); let sw=0,sw2=0;
  for(let n=0;n<N;n++){ w[n]=0.42-0.5*Math.cos(2*Math.PI*n/N)+0.08*Math.cos(4*Math.PI*n/N); sw+=w[n]; sw2+=w[n]*w[n]; }
  BW.sw=sw; BW.sw2=sw2;
  const T=new Float64Array(21);                     // power response at 0 … 5 bins off a bin centre, 0.25-bin steps
  for(let d=0;d<T.length;d++){ let re=0; const dl=d*0.25; for(let n=0;n<N;n++) re+=w[n]*Math.cos(2*Math.PI*dl*(n-N/2)/N); T[d]=(re/sw)*(re/sw); }
  BW.lobe=T;
}
/* what FORM would measure for a harmonic tone (relative powers pr[1..H]) plus white noise of per-bin power nu */
function modelFeat(pr,f0,nu,ctxm){
  const {bh,kLo,kHi,sumK,K}=ctxm, c1=(BW.sw/(2*BW.N))*(BW.sw/(2*BW.N));
  const pt=ctxm.pt, ks=ctxm.ks; let nk=0; ctxm.mark.fill(0);
  for(let h=1;h<pr.length;h++){
    const fh=f0*h; if(fh>FC.bandHi||fh>SR*0.48) break;
    const kh=fh/bh, k0=Math.round(kh);
    for(let dk=-5;dk<=5;dk++){ const k=k0+dk; if(k<kLo||k>kHi) continue;
      const di=Math.round(Math.abs(k-kh)*4); if(di>20) continue;
      const p=c1*pr[h]*BW.lobe[di];
      if(!ctxm.mark[k-kLo]){ ctxm.mark[k-kLo]=1; ks[nk++]=k; pt[k-kLo]=0; }
      pt[k-kLo]+=p; }
  }
  let pmax=0, Sp=0, Sk=0, SkT=0; for(let q=0;q<nk;q++){ const k=ks[q], p=pt[k-kLo]+nu; if(p>pmax) pmax=p; Sp+=p; Sk+=p*k; SkT+=k; }
  const rest=K-nk;
  Sp+=nu*rest; Sk+=nu*(sumK-SkT);
  const cen=(Sk/Sp)*bh, bright=Math.max(0,Math.log2(cen/f0));
  const fl=(pmax>0?pmax:1)*Math.pow(10,-FC.flatDepth/10);
  let lg=0, ar=0; for(let q=0;q<nk;q++){ const p=Math.max(pt[ks[q]-kLo]+nu,fl); lg+=Math.log(p); ar+=p; }
  const pe=Math.max(nu,fl); lg+=rest*Math.log(pe); ar+=rest*pe;
  const za=cl(-10*Math.log10(Math.exp(lg/K)/(ar/K)),0,127);
  return {bright,za};
}
/* solve a tone: harmonic tilt s, even weight, noise — so the model lands on (bright, even share) or (bright, za) */
function solveTone(pitch,bright,zev,zv){
  bwInit();

  const Hm=Math.max(2,Math.min(FC.maxHarm,Math.floor(Math.min(FC.bandHi,SR*0.48)/f0)));
  let sumK=0; for(let k=kLo;k<=kHi;k++) sumK+=k;
  const ctxm={bh,kLo,kHi,sumK,K:kHi-kLo+1,pt:new Float64Array(kHi-kLo+2),mark:new Uint8Array(kHi-kLo+2),ks:new Int32Array(kHi-kLo+2)};
  const share=zev?cl(zv,0.01,0.99):0.5;
  const pr=new Float64Array(Hm+1);
  const shape=(s,eW)=>{ pr[1]=1; for(let h=2;h<=Hm;h++) pr[h]=Math.pow(h,-2*s)*((h&1)?1:eW); };

/* lane: tap a row to select it (and open LAYER), drag across it to mark a
   region, tap the number cell to mute, tap the selected row to clear the region */
(function(){
  const cv = CN.lane; let drag = null;
  const toS = (x, w) => cl((x - LX)/(w - LX), 0, 1)*N;
  const snap = s => { const q = s16(); return Math.round(Math.round(s/q)*q); };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if(y < HB || !layers.length) return;
    const {rh} = laneRows(r.height), i = Math.floor((y - HB)/rh);
    if(i < 0 || i >= layers.length) return;
    if(x < LX){ sel = i; toggleLayer('mute'); if(page === 'layer') renderActs(); return; }
    const wasSel = sel === i;
    sel = i;
    if(page !== 'layer') setPage('layer'); else { renderActs(); drawKnobs(); }
    cv.setPointerCapture(e.pointerId);
    drag = {s0:toS(x, r.width), x0:x, moved:false, wasSel};
    drawLane();
  }, {passive:false});
  cv.addEventListener('pointermove', e => {
    if(!drag) return; e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
    if(Math.abs(x - drag.x0) > 6) drag.moved = true;
    if(!drag.moved) return;
    const s = toS(x, r.width);
    let a = snap(Math.min(drag.s0, s)), b = snap(Math.max(drag.s0, s));
    if(b - a < s16()) b = Math.min(N, a + Math.round(s16()));
    region = {a, b};
    hud('REGION', fmtSpan(a,b), 'buttons now act on this span');
    drawLane();
  }, {passive:false});
  const end = () => {
    if(drag && !drag.moved && drag.wasSel && region){ region = null; hud('REGION','cleared','edits act on the whole layer'); }
    else if(drag && !drag.moved) hud('LAYER ' + (sel+1), 'selected', 'drag across it to mark a region');
    drag = null; drawLane();
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

/* performance surface: pads (image chords, slide ↕ to open the filter) or keys */
(function(){
  const cv = CN.perf;
  const padHit = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for(let i=0;i<pads.length;i++){ const p = padRect(i, r.width, r.height); if(x>=p.x && x<=p.x+p.w && y>=p.y && y<=p.y+p.h) return i; }
    return -1;
  };
  const keyHit = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, kw = r.width/WH.length;
    let base = kBase(), yy = y, hh = r.height;
    if(perfMode === 'keys2'){ hh = r.height/2; if(y < hh) base += 12*dualOff; else yy = y - hh; }   // top half = upper manual, bottom half = lower manual
    if(yy < hh*.60) for(const b of BK){ const bx = (b.i+1)*kw - kw*.30; if(x >= bx && x <= bx + kw*.60) return base + b.o; }
    return base + WH[cl(Math.floor(x/kw), 0, WH.length-1)];
  };
  const drumHitAt = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const col = cl(Math.floor(x/(r.width/4)),0,3), row = cl(Math.floor(y/(r.height/2)),0,1);
    return row*4+col;
  };
  cv.addEventListener('pointerdown', async e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if(!ctx || !synthIn){ await initAudio(); if(!cv.hasPointerCapture(e.pointerId)) return; }
    resume();
    if(perfMode === 'drums'){
      const i = drumHitAt(e); if(i < 0) return;
      drumHit(i); drumFlash[i] = 1; drawPerf();
      hud('DRUM', DRUMS[i], '');
      return;
    }
    if(perfMode === 'pads'){
      const i = padHit(e); if(i < 0) return;
      const notes = padChord(i);
      if(arpOn){ arpAddNotes('p'+e.pointerId, notes); }
      else{
        const sg = val('strum'), hm = val('human'), pid = e.pointerId;
        notes.forEach((m, k) => {
          const dly = (k*sg + Math.random()*hm*0.03)*1000, vv = cl(0.8*(1 - hm*0.35*Math.random()), 0.1, 1);
          if(dly < 2) voiceOn('p'+pid+':'+m, m, vv);
          else setTimeout(() => { if(padTouch.has(pid)) voiceOn('p'+pid+':'+m, m, vv); }, dly);      // skipped if you already let go
        });
      }
      padTouch.set(e.pointerId, {i, notes, y0:e.clientY});
      held.set('p'+e.pointerId, pads[i].col);
      hud(chordName(i), notes.map(m => NOTE[((m%12)+12)%12]).join(' '), arpOn ? 'ARP · '+ARP_PATS[arpPat] : NOTE[val('root')]+' '+SCALES[val('scale')].name+' · slide ↕ filter');
    } else {
      const m = keyHit(e);
      keyDown.set(e.pointerId, m); held.set('k'+e.pointerId, rowCol || {r:224,g:164,b:92});
      if(arpOn) arpAddNotes('k'+e.pointerId, [m]);
      else voiceOn('k'+e.pointerId, m, 0.8);
      hud('KEY', NOTE[m%12] + (Math.floor(m/12)-1), arpOn ? 'ARP' : '');
    }
    drawPerf();
  }, {passive:false});
  cv.addEventListener('pointermove', e => {
    if(perfMode === 'drums') return;
    if(perfMode === 'pads'){
      const t = padTouch.get(e.pointerId); if(!t || arpOn) return; e.preventDefault();
      cutMod = cl((t.y0 - e.clientY)/70, -3, 3); liveFilter();
      return;
    }
    if(!keyDown.has(e.pointerId)) return; e.preventDefault();
    const m = keyHit(e);
    if(m !== keyDown.get(e.pointerId)){
      if(arpOn){ arpRemoveNotes('k'+e.pointerId); arpAddNotes('k'+e.pointerId, [m]); }
      else { noteOff('k'+e.pointerId); voiceOn('k'+e.pointerId, m, 0.8); }
      keyDown.set(e.pointerId, m); drawPerf();
    }
  }, {passive:false});
  const end = e => {
    const t = padTouch.get(e.pointerId);
    if(t){ if(arpOn) arpRemoveNotes('p'+e.pointerId); else t.notes.forEach(m => noteOff('p'+e.pointerId+':'+m));
           padTouch.delete(e.pointerId); held.delete('p'+e.pointerId); if(!padTouch.size){ cutMod = 0; } }
    if(keyDown.has(e.pointerId)){ if(arpOn) arpRemoveNotes('k'+e.pointerId); else noteOff('k'+e.pointerId); keyDown.delete(e.pointerId); held.delete('k'+e.pointerId); }
    drawPerf();
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

/* warp macro pad: move the puck → both axis-macros drive their dials. */
(function(){
  const cv = CN.wp; let down = false, hold = null, holdT = 0, hx = 0, hy = 0, pend = null;
  const move = e => {
    const r = cv.getBoundingClientRect();
    wpPos = { x: cl((e.clientX - r.left)/r.width, 0, 1), y: cl((e.clientY - r.top)/r.height, 0, 1) };
    applyWarp();
    drawWP(); if(page === 'osc' || page === 'amp' || page === 'fx' || page === 'key') drawKnobs();
    const m = WP_MODES[wpMode];
    hud('WARP', m.name, m.x.split('→').pop().trim() + ' ' + Math.round(wpPos.x*100) + '%  ·  ' + m.y.split('→').pop().trim() + ' ' + Math.round((1-wpPos.y)*100) + '%');
  };
  const cornerAt = e => {
    if(!WP_MODES[wpMode].free) return null;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, S = 36;
    const lf = x < S, rt = x > r.width - S, tp = y < S, bt = y > r.height - S;
    if(!((lf||rt) && (tp||bt))) return null;
    return tp ? (lf ? 'C' : 'D') : (lf ? 'A' : 'B');
  };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); resume(); down = true; try{ cv.setPointerCapture(e.pointerId); }catch(er){}
    const k = cornerAt(e);
    if(k){ hold = k; hx = e.clientX; hy = e.clientY; pend = e; holdT = setTimeout(()=>{ holdT = 0; const kk = hold; hold = null; pend = null; if(kk) storeCorner(kk); }, 450); return; }
    move(e);
  }, {passive:false});
  cv.addEventListener('pointermove', e => {
    if(!down) return; e.preventDefault();
    if(hold){ if(Math.hypot(e.clientX-hx, e.clientY-hy) < 8) return; clearTimeout(holdT); holdT = 0; hold = null; pend = null; }
    move(e);
  }, {passive:false});
  const end = () => {
    if(holdT){ clearTimeout(holdT); holdT = 0; if(hold && pend){ move(pend); } }      // a quick tap on a corner jumps the puck there
    hold = null; pend = null; if(down) saveWP(); down = false;
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

function layoutDisplay(){
  const act = activeViews(), n = act.length;
  ['img','wave','scope'].forEach(v => { $(DISP_CV[v]).classList.toggle('show', dispOn[v] && !dispFold); });
  document.querySelectorAll('#dispTabs button[data-disp]').forEach(b => b.classList.toggle('on', dispOn[b.dataset.disp]));
  const hide = dispFold || n === 0;
  $('display').classList.toggle('col', hide);
  $('dispTog').textContent = hide ? 'SHOW ▾' : 'HIDE ▴';
  syncFormUI();
  if(!hide){
    /* the display is one fixed section; whatever's open splits it evenly, so
       a single open view fills the whole thing (big image / big scope). */
    const big = dispOn.scope && SCOPE_MODES[scopeMode] === 'FORM';
    const sectionH = Math.min(Math.round(window.innerHeight * (big ? 0.36 : 0.34)), big ? 300 : 196);
    $('dispBody').style.height = sectionH + 'px';
  }
  requestAnimationFrame(drawAll);
}
function toggleView(v){ dispOn[v] = !dispOn[v]; if(dispOn[v]) dispFold = false; saveDisp(); layoutDisplay(); }
function showView(v){ if(!dispOn[v] || dispFold){ dispOn[v] = true; dispFold = false; saveDisp(); layoutDisplay(); } }   // force a view visible
document.querySelectorAll('#dispTabs button[data-disp]').forEach(b => b.addEventListener('click', () => toggleView(b.dataset.disp)));
$('dispTog').addEventListener('click', () => { if(!activeViews().length) dispOn.wave = true; dispFold = !dispFold; saveDisp(); layoutDisplay(); });
layoutDisplay();

/* ── PATCH save / recall ── snapshot every dial + wave + arp/perc/warp ── */
const PATCH_SLOTS = 6;
let patchSaveArm = false;
const OLD_PADN=[4,6,8,12,16];
function patchSnapshot(){
  const ns = {}; for(const id in PR) if(!PR[id].layer) ns[id] = PR[id].n;
  return { padsV:2, dialsV:2, wpCorners: wpCorners ? JSON.parse(JSON.stringify(wpCorners)) : null, ns, wpMode, wave: Array.from(wDraw), arpOn, arpPat, arpLatch, morph: PR.morph.n };
}
let patchPrev = null;
try{ patchPrev = JSON.parse(localStorage.getItem('alphaSynthPatchPrev') || 'null'); }catch(e){}
function stashPrev(){ patchPrev = patchSnapshot(); try{ localStorage.setItem('alphaSynthPatchPrev', JSON.stringify(patchPrev)); }catch(e){} $('pBack').disabled = false; }
function patchApply(P){ if(!P) return; stashPrev(); patchApplyRaw(P); }
function patchApplyRaw(P){
  if(!P) return;
  if(P.dialsV !== 2){ for(const id in NEW_DEF){ PR[id].n = NEW_DEF[id]; apply(id); } }                // a patch saved before these dials existed means "off"
  for(const id in P.ns) if(PR[id] && !PR[id].layer && !PR[id].tempo){ PR[id].n = P.ns[id]; apply(id); }
  if(!tempoLocked()){ for(const id of ['bpm','bars','beats']) if(P.ns[id]!=null){ PR[id].n = P.ns[id]; apply(id); } }
  if(P.ns && P.ns.pads!=null && P.padsV!==2){ const c=OLD_PADN[Math.round(cl(P.ns.pads,0,1)*(OLD_PADN.length-1))]; PR.pads.n = Math.max(0,PADN.indexOf(c))/(PADN.length-1); apply('pads'); }
  if(P.wpCorners && typeof P.wpCorners==='object'){ wpCorners = JSON.parse(JSON.stringify(P.wpCorners)); }
  if(Array.isArray(P.wave) && P.wave.length === NW){ for(let i=0;i<NW;i++) wDraw[i] = P.wave[i]; blend(); }
  if(Number.isInteger(P.wpMode)) wpMode = cl(P.wpMode,0,WP_MODES.length-1);
  arpPat = P.arpPat|0; arpLatch = !!P.arpLatch;
  if(arpOn && !P.arpOn) toggleArp(); else arpOn = !!P.arpOn;
  $('wpMode').textContent = WP_MODES[wpMode].name;
  drawKnobs(); drawWarp(); drawWP(); drawPerf();
}
function loadPatches(){ try{ return JSON.parse(localStorage.getItem('alphaSynthPatch') || '{}'); }catch(e){ return {}; } }
function savePatches(o){ try{ localStorage.setItem('alphaSynthPatch', JSON.stringify(o)); }catch(e){} }
function refreshPatchUI(){
  const P = loadPatches();
  document.querySelectorAll('#patch button[data-slot]').forEach(b => b.classList.toggle('filled', !!P[b.dataset.slot]));
  $('pSave').classList.toggle('on', patchSaveArm);
}
document.querySelectorAll('#patch button[data-slot]').forEach(b => {
  b.addEventListener('click', () => {
    const slot = b.dataset.slot, P = loadPatches();
    if(patchSaveArm){
      P[slot] = patchSnapshot(); savePatches(P); patchSaveArm = false; refreshPatchUI();
      hud('PATCH', 'saved to ' + (+slot+1), '');
    } else if(P[slot]){
      patchApply(P[slot]); hud('PATCH', 'loaded ' + (+slot+1), '');
    } else hud('PATCH', 'slot ' + (+slot+1) + ' empty', 'arm SAVE, then tap a slot');
  });
});
let patchArmTimer = 0;
$('pSave').addEventListener('click', () => { patchSaveArm = !patchSaveArm; refreshPatchUI(); clearTimeout(patchArmTimer);
  if(patchSaveArm) patchArmTimer = setTimeout(()=>{ patchSaveArm = false; refreshPatchUI(); hud('PATCH','save disarmed',''); }, 5000);
  hud('PATCH', patchSaveArm ? 'SAVE armed' : 'save cancelled', patchSaveArm ? 'tap a slot within 5 s' : ''); });
$('pBack').disabled = !patchPrev;
$('pBack').addEventListener('click', () => {
  if(!patchPrev){ hud('PATCH','nothing to bring back',''); return; }
  const back = patchPrev; stashPrev(); patchApplyRaw(back); hud('PATCH','previous sound back · tap again to return',''); });

/* ═════════════════════════ FRAME ═════════════════════════ */
let lastPos = '';
function frame(){
  requestAnimationFrame(frame);
  if(ctx){
    if(recState === 'armed' && recJob && ctx.currentTime >= recJob.tBar){ recState = 'rec'; drawTx(); }
    if(scanOn && running && px && ctx.currentTime >= loopStart){
      const row = Math.floor(posAt(ctx.currentTime)/loopLen*ih);
      if(row !== lastScanRow){ lastScanRow = row; readY = row/ih; readRow(row); drawScr(); }
    }
    flushWave();
    if(FORM) FORM.frameTick(performance.now()); else drawOut();
    if(perfMode === 'drums'){ let any=false; for(let i=0;i<8;i++){ if(drumFlash[i]>0.01){ drumFlash[i]*=0.82; any=true; } else drumFlash[i]=0; } if(any) drawPerf(); }
    if(running || recState !== 'idle') drawLane();
    let pos = '■';
    if(running){
      const g = G();
      if(ctx.currentTime < loopStart){ pos = 'COUNT ' + Math.ceil((loopStart - ctx.currentTime)/beatDur); }
      else { const b = Math.floor(posAt(ctx.currentTime)/beatDur); pos = (Math.floor(b/g.beats)+1) + '.' + (b%g.beats+1) + ' / ' + g.bars; }
    }
    if(recState === 'rec') pos = '● ' + pos; else if(recState === 'armed') pos = 'ARM ' + pos;
    if(pos !== lastPos){ lastPos = pos; const hp = $('hudPos'); hp.textContent = pos; hp.className = recState === 'rec' ? 'rec' : (recState === 'armed' ? 'arm' : ''); }
  }
  if(hudAt && performance.now() - hudAt > 3200 && !held.size){
    hudAt = 0;
    $('hudName').textContent = page.toUpperCase();
    $('hudVal').textContent = layers.length ? layers.length + ' layers · ' + G().bpm + ' bpm' : (loadedImage ? 'image loaded' : 'no image');
    $('hudSrc').textContent = '';
  }
}

/* iOS: refuse selection / magnifier / pinch inside the instrument */
['selectstart','contextmenu','gesturestart','gesturechange','dragstart']
  .forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px'); }
setVH();
/* iOS can pause audio (call, Siri, lock, tab switch): let go of every note when the page leaves, and wake the context on any touch */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ try{ panic(); }catch(e){} } else resume(); });
window.addEventListener('pagehide', ()=>{ try{ panic(); }catch(e){} });
document.addEventListener('pointerdown', ()=>{ if(ctx && ctx.state !== 'running') resume(); }, true);
window.addEventListener('resize', ()=>{ setVH(); requestAnimationFrame(()=>{ layoutDisplay(); drawAll(); showSizes(); }); });
window.addEventListener('orientationchange', ()=>setTimeout(()=>{ setVH(); drawAll(); showSizes(); }, 250));

setGeom();
$('wpMode').textContent = WP_MODES[wpMode].name; $('wpSide').classList.toggle('col', !wpOpen); $('wpTog').textContent = wpOpen ? '▸' : '◂'; refreshPatchUI();
renderActs();
requestAnimationFrame(()=>{ drawVent(); drawAll(); showSizes(); requestAnimationFrame(frame); });
setTimeout(()=>{ drawAll(); showSizes(); }, 300);
applyGlow();
hud('SYNTH','load an image or just play','● REC records a loop');
}catch(e){ showErr('init: ' + (e && e.message || e) + '\n' + (e && e.stack ? String(e.stack).split('\n').slice(0,2).join('\n') : '')); }
})();
</script>
