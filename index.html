<title>Tabula Anatomica II: living specimen</title>
<style>

<script>
'use strict';
// ===================== TABULA CORE — laws, organism, metrics, investigator (no DOM) =====================
const H=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

// [group, key, label, min, max, step, default, flag]   flag 'g' = regrows the specimen
const PDEF=[

['ADAPT','atrophy','Disuse atrophy',0,2,0.05,0.15],

['ADAPT','repair','Repair rate',0,2,0.05,0.3],

['ADAPT','recruit','Recruitment rate',0,3,0.05,0.35],
['ADAPT','recruitR','Recruitment reach',0.1,0.7,0.01,0.32],
['ADAPT','calcRate','Calcification rate',0,2,0.05,0.25],
['ADAPT','calcE','Calcify below energy',0,0.6,0.01,0.22],
['PRESSURE','pI','Pressure intensity',0,1,0.01,0.5],
['CLASSIFY','anomD','Anomaly threshold',0.1,1,0.01,0.34],
['CLASSIFY','baseD','Intact threshold',0.02,0.5,0.01,0.16],
['CLASSIFY','classEvery','Re-examine every (s)',0.25,5,0.25,1],
['INJECT','injR','Injection radius',0.05,0.9,0.01,0.28],
['INJECT','injI','Injection intensity',0,1,0.01,0.6],
['INJECT','headOff','Tool head offset (px)',0,160,2,72],
['OPERATE','incDepth','Incision depth',0.05,2,0.01,0.45],
['OPERATE','hookK','Forceps strength',2,160,1,70],
['OPERATE','hookR','Forceps grip',0.03,0.4,0.01,0.16],
['VIEW','nodeSize','Node size',0,4,0.1,1.6],
['VIEW','fiberA','Fiber opacity',0.05,1,0.01,0.55],
['VIEW','skinA','Skin opacity',0,1,0.01,0.85],
['VIEW','contagion','Contagion',0,2,0.05,1],
['VIEW','camD','Camera distance',2,10,0.1,4.4],
];
const P={};for(const d of PDEF)P[d[1]]=d[6];
const LAW={damage:true,energy:true,signal:true,adapt:true};
const TISSUE=['core','mid','membrane','conduit'];

const PRESSURES=[
 {id:'none',num:'',lat:'',name:'No pressure',
  mech:'Baseline physiology only. The specimen lives under its own laws.',desc:''},
 {id:'dissolutio',num:'I',lat:'Dissolutio ego',name:'Boundary collapse',
  mech:'Raises internal pressure and slowly erodes the fibers binding the membrane to inner tissue.',
  desc:'The systemic failure of the ego-membrane. Nervous tissue unbinds from bone, dissolving identity into a continuous pool of anxiety.'},
 {id:'praedestinatio',num:'II',lat:'Praedestinatio aeterna',name:'Recursive damnation',
  mech:'Shortens the refractory period, strengthens contraction and excites the core, inviting re-entrant firing loops.',
  desc:'An infinite loop of structural condemnation. The rings of the soul-stem constrict iteratively; escape is mathematically impossible.'},
 {id:'necrosis',num:'III',lat:'Necrosis memoriae',name:'Erasure',
  mech:'Starves the membrane of intake and raises metabolic cost everywhere.',
  desc:'The calcification and flaking away of experiential registry. Nodes dry, blacken and detach, leaving voids in the architecture.'},
 {id:'inspectio',num:'IV',lat:'Inspectio invisibilis',name:'Continuous observation',
  mech:'Active interior tissue is drawn toward the observer. The gaze is your camera: where you look from matters.',
  desc:'An unblinking gaze mapped onto the optic chiasm. Every internal fiber reorients toward a focal point outside the vessel.'},
 {id:'barathrum',num:'V',lat:'Barathrum infinitum',name:'Abyssal fall',
  mech:'A dense sink opens below the thoracic center and pulls on all mass, with downward weight.',
  desc:'A gravitational anomaly within the thoracic cavity. Internal anchors snap one by one, dragging the arterial tree into a singularity.'},
];

let S=null;

function newOrg(N,FC){
 const f32=n=>new Float32Array(n);
 return {N,F:0,FC,
  x:f32(N),y:f32(N),z:f32(N),vx:f32(N),vy:f32(N),vz:f32(N),fx:f32(N),fy:f32(N),fz:f32(N),
  m:f32(N),tt:new Uint8Array(N),E:f32(N),sig:f32(N),ref:f32(N),acc:f32(N),acc2:f32(N),dE:f32(N),
  dC:f32(N),compounds:[],shots:0,vcls:new Uint8Array(N),vgen:new Uint8Array(N),hooks:[],tri:new Int32Array(0),triF:new Int32Array(0),
  dmg:f32(N),dead:new Uint8Array(N),calc:f32(N),mob:f32(N),starve:f32(N),fires:new Uint32Array(N),recruits:new Uint8Array(N),
  adj:Array.from({length:N},()=>[]),
  fa:new Int32Array(FC),fb:new Int32Array(FC),L0:f32(FC),Lr:f32(FC),km:f32(FC),kb:f32(FC),tolM:f32(FC),fat:f32(FC),
  cond:f32(FC),scar:f32(FC),sa:f32(FC),use:f32(FC),alive:new Uint8Array(FC),born:f32(FC),broke:f32(FC),rec:new Uint8Array(FC),
  time:0,tick:0,seed:1,turgScale:1,pressure:'none',sink:[0,-0.3,0],gaze:[0,0,-1],
  cx:0,cy:0,cz:0,Etis:new Float32Array(4),
  ring:new Float32Array(240),ringPos:0,fireAcc:0,fireT:0,
  cnt:{broken:0,formed:0,necro:0},
  win:{t:0,breaks:0,pairs:{},necro:0,recruit:0},
  events:[],init:null,rmin:0.1,cell:0.2,
  pairs:new Int32Array(N*24),np:0,
  gHead:new Int32Array(4096),gNext:new Int32Array(N),stamp:new Int32Array(N),st:0
 };
}
function ev(text){if(S)S.events.push({t:S.time,text});}
function pairName(a,b){const n=[TISSUE[a],TISSUE[b]].sort();return n[0]===n[1]?n[0]:n[0]+'–'+n[1];}

function addFiber(o,a,b,L0,km,kb,tolM,cond,rec,Lr){
 if(o.F>=o.FC)return -1;const f=o.F++;
 o.fa[f]=a;o.fb[f]=b;o.L0[f]=L0;o.Lr[f]=Lr||L0;o.km[f]=km;o.kb[f]=kb;o.tolM[f]=tolM;o.cond[f]=cond;
 o.fat[f]=0;o.scar[f]=0;o.sa[f]=0;o.use[f]=0;o.alive[f]=1;o.born[f]=o.time;o.broke[f]=-1;o.rec[f]=rec?1:0;
 o.adj[a].push(f);o.adj[b].push(f);return f;
}

// ---------- growth: a viable, recursively organized starting anatomy ----------
function grow(seed){
 seed=Math.floor(Math.abs(seed))||1;
 const h=(i,j)=>H(i*1.6180339+seed*0.1371,j*2.7182818+seed*0.0917);
 const ax=1,ay=P.elong,az=0.85;
 const q0=h(4,4)*6.283,q1=h(1,1)*6.283,q2=h(2,2)*6.283,q3=h(3,3)*6.283;
 const shapeR=(dx,dy,dz)=>{const th=Math.atan2(dz,dx),ph=Math.acos(clamp(dy,-1,1)),sp=Math.sin(ph);
  return Math.max(0.6,1+P.lobe*(0.2*Math.sin(2*th+q1)*sp*sp+0.13*Math.cos(3*ph+q2)+0.1*Math.sin(3*th+q3)*sp));};
 const frac=(x,y,z)=>{const qx=x/ax,qy=y/ay,qz=z/az,r=Math.hypot(qx,qy,qz);return r<1e-6?0:r/shapeR(qx/r,qy/r,qz/r);};
 const pts=[],typ=[];
 const put=(dx,dy,dz,f,t)=>{const r=shapeR(dx,dy,dz)*f;pts.push([dx*r*ax,dy*r*ay,dz*r*az]);typ.push(t);};
 const nM=P.nMem|0;
 const mdirs=[];
 for(let i=0;i<nM;i++){const yy=1-2*(i+0.5)/nM,rr=Math.sqrt(1-yy*yy),th=i*2.399963229+q0;mdirs.push([Math.cos(th)*rr,yy,Math.sin(th)*rr]);put(Math.cos(th)*rr,yy,Math.sin(th)*rr,1,2);}
 const skin=hull3(mdirs);
 // interior: 3D R-sequence (no Math.random)
 const g=1.2207440846057596,A=[1/g,1/(g*g),1/(g*g*g)],off=[h(5,1),h(5,2),h(5,3)];
 let n=0;
 const fill=(count,lo,hi,t)=>{let got=0,guard=0;while(got<count&&guard<400000){guard++;n++;
  const ux=((off[0]+n*A[0])%1)*2-1,uy=((off[1]+n*A[1])%1)*2-1,uz=((off[2]+n*A[2])%1)*2-1,f=Math.hypot(ux,uy,uz);
  if(f<lo||f>hi||f<1e-6)continue;put(ux/f,uy/f,uz/f,f,t);got++;}};
 fill(P.nMid|0,0.46,0.86,1);
 fill(P.nCore|0,0,0.42,0);
 // conduit tree: recursive branching, breadth-first so depth stays balanced under the cap
 const links=[],vinfo=new Map();pts.push([0,0,0]);typ.push(3);const c0=pts.length-1;vinfo.set(c0,[0,0]);
 const Q=[{from:c0,p:[0,0,0],d:[0,1,0],len:0.34*ay,depth:P.depth|0,cls:0,gen:0},{from:c0,p:[0,0,0],d:[0,-1,0],len:0.34*ay,depth:P.depth|0,cls:1,gen:0}];
 let qi=0,tn=0;const cap=420;
 while(qi<Q.length&&tn<cap){const b=Q[qi++];let prev=b.from,p=b.p,d=b.d,ok=true;
  for(let s=0;s<3;s++){tn++;
   let dx=d[0]+0.3*(h(tn,11)-0.5),dy=d[1]+0.3*(h(tn,12)-0.5),dz=d[2]+0.3*(h(tn,13)-0.5);const dl=Math.hypot(dx,dy,dz);d=[dx/dl,dy/dl,dz/dl];
   const np=[p[0]+d[0]*b.len/3,p[1]+d[1]*b.len/3,p[2]+d[2]*b.len/3];
   if(frac(np[0],np[1],np[2])>0.84){ok=false;break;}
   pts.push(np);typ.push(3);vinfo.set(pts.length-1,[b.cls,b.gen]);links.push([prev,pts.length-1]);prev=pts.length-1;p=np;}
  if(ok&&b.depth>0){
   const rf=Math.abs(d[1])<0.9?[0,1,0]:[1,0,0];
   let ux=d[1]*rf[2]-d[2]*rf[1],uy=d[2]*rf[0]-d[0]*rf[2],uz=d[0]*rf[1]-d[1]*rf[0];const ul=Math.hypot(ux,uy,uz);ux/=ul;uy/=ul;uz/=ul;

// ---------- spatial grid ----------
function gkey(ix,iy,iz){return ((ix*73856093)^(iy*19349663)^(iz*83492791))&4095;}
function buildGrid(){const o=S,c=o.cell;o.gHead.fill(-1);
 for(let i=0;i<o.N;i++){const k=gkey(Math.floor(o.x[i]/c),Math.floor(o.y[i]/c),Math.floor(o.z[i]/c));o.gNext[i]=o.gHead[k];o.gHead[k]=i;}}
function query(px,py,pz,r,cb){const o=S,c=o.cell,R=Math.ceil(r/c),ix=Math.floor(px/c),iy=Math.floor(py/c),iz=Math.floor(pz/c);

 for(let dx=-R;dx<=R;dx++)for(let dy=-R;dy<=R;dy++)for(let dz=-R;dz<=R;dz++){const k=gkey(ix+dx,iy+dy,iz+dz);
  for(let j=o.gHead[k];j!==-1;j=o.gNext[j]){if(o.stamp[j]===st)continue;o.stamp[j]=st;cb(j);}}}
function buildPairs(){const o=S;buildGrid();o.np=0;const r=o.rmin*1.3,r2=r*r;

  query(xi,yi,zi,r,j=>{if(j<=i)return;const dx=o.x[j]-xi,dy=o.y[j]-yi,dz=o.z[j]-zi;
   if(dx*dx+dy*dy+dz*dz<r2){if(o.np+2>o.pairs.length){const np=new Int32Array(o.pairs.length*2);np.set(o.pairs);o.pairs=np;}

// ---------- Layer 1: mechanics ----------
function breakFiber(f,cause){const o=S;if(!o.alive[f])return;o.alive[f]=0;o.broke[f]=o.time;o.cnt.broken++;

 if(cause!=='necrosis'){o.dmg[a]=Math.min(1,o.dmg[a]+P.breakDmg);o.dmg[b]=Math.min(1,o.dmg[b]+P.breakDmg);}

function step(dt){

function computeTissueMeans(){const o=S,s=[0,0,0,0],c=[0,0,0,0];

// ---------- per-frame laws: signal, energy, adaptation (Layer 1 + 2) ----------
function frameLaws(dtf){

 // SIGNAL

  const p2=pr==='praedestinatio'?I:0,refrE=P.refract*(1-0.85*p2),decay=Math.exp(-dtf/P.sigDecay);
  const coreBoost=1+3*p2,gainE=P.gain*(1+0.8*p2),acc=o.acc,acc2=o.acc2;

   }

  const sc=req>P.budget&&req>0?P.budget/req:1;

   if(t===2)e+=P.intake*(1-0.75*o.calc[i])*nI*sc*dtf-P.cold*dtf;

   if(o.E[i]<0.02)o.starve[i]+=dtf;else o.starve[i]=Math.max(0,o.starve[i]-dtf*0.5);

// ---------- measurement ----------
function rhythm(){const o=S,RL=o.ring.length,a=new Float32Array(RL);

function computeMetrics(silent){

 if(alive){cx/=alive;cy/=alive;cz/=alive;}

 for(const v of sz2.values())if(v>cl)cl=v;

 const Es=[0,0,0,0],Ec=[0,0,0,0],Ms=[0,0,0,0];let calcMem=0,yv=0,memR=0,nm=0,icx=0,icy=0,icz=0,ni=0,mcx=0,mcy=0,mcz=0;
 for(let i=0;i<N;i++){if(o.dead[i])continue;const t=o.tt[i];Es[t]+=o.E[i];Ec[t]++;Ms[t]+=o.mob[i];
  const dy=o.y[i]-cy;yv+=dy*dy;

  else if(t<2){icx+=o.x[i];icy+=o.y[i];icz+=o.z[i];ni++;}}

 return {t:o.time,alive,dead:N-alive,N,cx,cy,cz,bodies,frags,severedActive:tw.size,largestFrac:alive?largest/alive:0,
  aliveF,totalF:o.F,broken:o.cnt.broken,formed:o.cnt.formed,formedAlive,condF,condFrac:alive?cl/alive:0,
  gini,meanRel,maxRel,p98,hot,detachFrac:memAlive?memDet/memAlive:0,Emean:alive?Esum/alive:0,Ecore:mean(Es[0],Ec[0]),Emid:mean(Es[1],Ec[1]),Emem:mean(Es[2],Ec[2]),Econd:mean(Es[3],Ec[3]),
  mobCore:mean(Ms[0]+Ms[1],Ec[0]+Ec[1]),mobMem:mean(Ms[2],Ec[2]),memCalc:mean(calcMem,nm),
  scar:aliveF?scarS/aliveF:0,fat:aliveF?fatS/aliveF:0,

function features(m){const o=S,i0=o.init||{memR:m.memR,ystd:m.ystd};

// ---------- Layer 3: the investigator ----------
const PROTO=[
 {id:'intact',num:'',name:'Intact specimen',f:{frag:0,broken:0,necro:0,collapse:0,expand:0,asym:0,strain:0}},
 {id:'dissolutio',num:'I',name:'Boundary collapse',f:{detach:0.7,broken:0.4,expand:0.3,collapse:0}},
 {id:'praedestinatio',num:'II',name:'Recursive damnation',f:{rhythm:0.85,firing:0.7,frag:0,necro:0,broken:0,asym:0,collapse:0}},
 {id:'necrosis',num:'III',name:'Erasure',f:{necro:0.7,starved:0.7,firing:0}},
 {id:'inspectio',num:'IV',name:'Continuous observation',f:{asym:0.8,strain:0.3,collapse:0,necro:0}},
 {id:'barathrum',num:'V',name:'Abyssal fall',f:{collapse:0.8,broken:0.5,strain:0.4}},
];
const DESCRIPT={frag:'fragmented',broken:'torn',strain:'strain-knotted',cold:'cold-shelled',rhythm:'rhythmic',firing:'convulsive',
 collapse:'collapsed',expand:'distended',asym:'drawn aside',necro:'necrotic',rewire:'self-rewired',detach:'shell-detached',starved:'starved'};
const FEATNAME={frag:'fragmentation',broken:'fiber loss',strain:'strain concentration',cold:'cold shell, warm core',rhythm:'coordinated rhythm',
 firing:'firing intensity',collapse:'collapse',expand:'distension',asym:'displaced interior',necro:'necrosis',rewire:'self-rewiring',detach:'shell detachment',starved:'starvation'};
const STRUCTURAL=['frag','broken','necro','collapse','expand','asym','cold','strain','detach','starved'];
function anomName(fv){const ks=Object.keys(fv).filter(k=>fv[k]>0.4).sort((a,b)=>fv[b]-fv[a]).slice(0,3);

function classify(fv){
 const sc=PROTO.map(p=>{let s=0,n=0;for(const k in p.f){const d=fv[k]-p.f[k];s+=d*d;n++;}return {p,d:Math.sqrt(s/n)};});
 const intact=sc[0],terr=sc.slice(1).sort((a,b)=>a.d-b.d),best=terr[0];
 const strong=Object.keys(fv).filter(k=>fv[k]>0.5),strongS=strong.filter(k=>STRUCTURAL.includes(k));
 let r;
 if(intact.d<P.baseD&&intact.d<=best.d&&strongS.length===0){
  r={kind:'intact',id:'intact',num:'',label:'Intact specimen',d:intact.d,unexpl:strong.filter(k=>k==='rhythm'||k==='rewire')};
 }else if(best.d<=P.anomD){
  r={kind:'terror',id:best.p.id,num:best.p.num,label:best.p.name,d:best.d,unexpl:strong.filter(k=>!(k in best.p.f))};
 }else{
  r={kind:'anomaly',id:'anomaly',num:'?',label:'Unclassified',d:best.d,near:best.p.id,nearNum:best.p.num,name:anomName(fv),unexpl:strong};
 }
 r.conf=clamp(1-r.d/(P.anomD*1.6),0,1);r.scores=sc.map(s=>({id:s.p.id,num:s.p.num,name:s.p.name,d:s.d}));

}
function featDist(a,b){let s=0,n=0;for(const k in a){const d=a[k]-(b[k]||0);s+=d*d;n++;}return n?Math.sqrt(s/n):1;}

// ---------- unknown compounds (mystery shot) ----------
const COMPOUND_FX=['stiffen','conduct','nourish','calcify','toughen','excite','swell'];
const FXWORD={stiffen:['stiffens fibers','softens fibers'],conduct:['opens signal pathways','blocks signal pathways'],
 nourish:['feeds tissue','starves tissue'],calcify:['calcifies tissue','dissolves calcification'],
 toughen:['raises strain tolerance','embrittles fibers'],excite:['provokes firing','sedates firing'],swell:['swells tissue','shrinks tissue']};
function newCompound(){const o=S,n=++o.shots,h=(a,b)=>H(n*3.17+o.seed*0.0131+a,b*1.91+n*0.71);
 const k=2+(h(1,1)>0.55?1:0),fx=[];let guard=0;
 while(fx.length<k&&guard<60){guard++;const e=COMPOUND_FX[Math.floor(H(n*7.31+guard*13.7+o.seed*0.0071,guard*5.3+n*0.917)*7)%7];
  if(!fx.find(p=>p.fx===e))fx.push({fx:e,s:(H(n*2.71+guard*31.9,o.seed*0.0193+guard*0.37)<0.5?-1:1)*(0.5+H(n*1.37+guard*17.3,guard*9.1))});}
 const c={n,code:`Compound ${n}`,fx,spread:0.6+h(5,5)*2.4,half:3+h(6,6)*9,c:new Float32Array(o.N),peak:0,age:0,total:0};
 o.compounds.push(c);
 if(o.compounds.length>3){const old=o.compounds.shift();ev(`${old.code} displaced before it cleared. Assay: ${assay(old)}`);}
 return c;}
function assay(c){return c.fx.map(e=>FXWORD[e.fx][e.s>0?0:1]).join(', ');}
function dose(c,center,r,I){const o=S,px=o.x[center],py=o.y[center],pz=o.z[center];
 for(let j=0;j<o.N;j++){if(o.dead[j])continue;const d=Math.hypot(o.x[j]-px,o.y[j]-py,o.z[j]-pz);if(d>r)continue;
  c.c[j]=Math.min(3,c.c[j]+I*(1-d/r));}}
function frameCompounds(dtf){const o=S;if(!o.compounds.length)return;
 for(let q=o.compounds.length-1;q>=0;q--){const cp=o.compounds[q],c=cp.c,dC=o.dC;dC.fill(0);
  for(let f=0;f<o.F;f++){if(!o.alive[f])continue;const a=o.fa[f],b=o.fb[f];
   const k=Math.min(cp.spread*(0.2+0.8*o.cond[f])*dtf,0.1),fl=k*(c[a]-c[b]);dC[a]-=fl;dC[b]+=fl;}

  for(let i=0;i<o.N;i++){if(o.dead[i]){c[i]=0;continue;}let v=(c[i]+dC[i])*dec;if(v<1e-4)v=0;c[i]=v;tot+=v;
   if(v>0.005)for(const e of cp.fx)applyFx(i,e,v,v*dtf);}
  cp.total=tot;cp.age+=dtf;if(tot>cp.peak)cp.peak=tot;
  if(cp.age>1&&(tot<0.03*cp.peak||tot<0.01)){o.compounds.splice(q,1);ev(`${cp.code} cleared. Assay: ${assay(cp)}`);}
 }}
function applyFx(i,e,c,r){const o=S,s=e.s;

  case 'conduct':for(const f of o.adj[i])if(o.alive[f])o.cond[f]=clamp(o.cond[f]+s*r*1.0,0.02,1);break;
  case 'nourish':o.E[i]=clamp(o.E[i]+s*r*1.0,0,1);break;
  case 'calcify':o.calc[i]=clamp(o.calc[i]+s*r*0.8,0,1);break;

// ---------- convex hull (incremental, O(n^2)) — skin mesh at birth, core organ each few frames ----------
function hull3(pts){const n=pts.length;if(n<4)return [];

 for(let i=1;i<n;i++){const v=sub(pts[i],pts[0]),d=dt(v,v);if(d>best){best=d;i1=i;}}

 for(let i=1;i<n;i++){if(i===i1||i===i2)continue;const d=Math.abs(dt(nn,sub(pts[i],pts[0])));if(d>best){best=d;i3=i;}}
 if(i3<0||best<1e-12)return [];
 const cen=[0,1,2].map(k=>(pts[0][k]+pts[i1][k]+pts[i2][k]+pts[i3][k])/4);
 const face=(a,b,c)=>{const nr=cr(sub(pts[b],pts[a]),sub(pts[c],pts[a])),l=Math.hypot(nr[0],nr[1],nr[2])||1;nr[0]/=l;nr[1]/=l;nr[2]/=l;return {a,b,c,n:nr,d:dt(nr,pts[a]),on:true};};

 let F=[out(0,i1,i2),out(0,i1,i3),out(0,i2,i3),out(i1,i2,i3)];
 const used=new Set([0,i1,i2,i3]);let cnt=0;
 for(let p=0;p<n;p++){if(used.has(p))continue;const P3=pts[p],E=new Map();let any=false;
  for(const f of F){if(!f.on)continue;if(dt(f.n,P3)-f.d>1e-9){any=true;f.on=false;E.set(f.a*n+f.b,[f.a,f.b]);E.set(f.b*n+f.c,[f.b,f.c]);E.set(f.c*n+f.a,[f.c,f.a]);}}
  if(!any)continue;
  for(const [a,b] of E.values())if(!E.has(b*n+a))F.push(face(a,b,p));
  if(++cnt%40===0)F=F.filter(f=>f.on);}

// ---------- it notices touch ----------
function sense(center,r,amount){const o=S;if(!o||!LAW.signal||amount<=0)return;const px=o.x[center],py=o.y[center],pz=o.z[center];
 for(let j=0;j<o.N;j++){if(o.dead[j])continue;const d=Math.hypot(o.x[j]-px,o.y[j]-py,o.z[j]-pz);if(d<r)o.acc[j]+=amount*(1-d/r);}}

 if(!S||snap.N!==S.N){el.innerHTML='<p class="small">The snapshot belongs to a different specimen.</p>';return;}
 const o=S;let torn=0,grown=0,died=0;
 for(let f=0;f<snap.F;f++)if(snap.alive[f]&&!o.alive[f])torn++;for(let f=snap.F;f<o.F;f++)if(o.alive[f])grown++;
 for(let i=0;i<o.N;i++)if(o.dead[i]&&!snap.dead[i])died++;
 const ds=[0,0,0,0],dc=[0,0,0,0];let mx=0,mi=-1;
 for(let i=0;i<o.N;i++){const a=(o.x[i]-o.cx)-snap.rx[i],b=(o.y[i]-o.cy)-snap.ry[i],c=(o.z[i]-o.cz)-snap.rz[i],d=Math.sqrt(a*a+b*b+c*c);ds[o.tt[i]]+=d;dc[o.tt[i]]++;if(d>mx){mx=d;mi=i;}}
 const drift=[0,1,2,3].map(t=>dc[t]?ds[t]/dc[t]:0);let most=0;for(let t=1;t<4;t++)if(drift[t]>drift[most])most=t;
 const fc=[];for(const k in feat){const d=feat[k]-(snap.f[k]||0);if(Math.abs(d)>0.08)fc.push(`${FEATNAME[k]} ${(snap.f[k]||0).toFixed(2)} → ${feat[k].toFixed(2)}`);}
 const rows=[['Elapsed',`${(o.time-snap.t).toFixed(1)} s since the ${snap.reason} at ${snap.t.toFixed(1)} s`],['Verdict',`then ${snap.verdict}; now ${clsText(cls)}`],
  ['Torn since',`${torn} fibers`],['Grown since',`${grown} recruited fibers survive`],['Died since',`${died} nodes`],
  ['Drift by tissue',`core ${drift[0].toFixed(3)}, mid ${drift[1].toFixed(3)}, membrane ${drift[2].toFixed(3)}, conduit ${drift[3].toFixed(3)}`],
  ['Changed most',`${TISSNAME[most]}; largest single move ${mx.toFixed(3)} at node ${mi}`],
  ['Findings shifted',fc.length?fc.join('; '):'no finding moved more than 0.08']];
 el.innerHTML=`<div class="rep">${rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')}</div>`;}
function renderAtlas(){const el=$('atlasList');if(!el)return;
 if(!atlas.length){el.innerHTML='<p class="small">The atlas is empty. Anomalies file themselves when the investigator cannot match a figure; File to atlas in Autopsy records any reading.</p>';return;}
 el.innerHTML=atlas.slice(0,60).map(a=>{const top=Object.entries(a.features||{}).filter(e=>e[1]>=0.35).sort((x,y)=>y[1]-x[1]).slice(0,5).map(e=>`${FEATNAME[e[0]]||e[0]} ${e[1].toFixed(2)}`).join(', ');
  return `<div class="at"><p class="atn">${a.id}. ${a.name||a.verdict}</p><p class="small">Seed ${a.seed} at ${a.t} s, pressure ${a.pressureLabel}${a.pressure!=='none'?` at ${a.intensity.toFixed(2)}`:''}, confidence ${Math.round(a.confidence*100)}%${a.nearest?`, nearest ${a.nearest}`:''}.${top?` ${top}.`:''}</p></div>`;}).join('');}
function renderLog(){const el=$('logList');if(!el)return;
 el.innerHTML=logs.length?logs.slice(-300).reverse().map(l=>`<div class="lg"><span>${l.t.toFixed(1)}</span>${l.text}</div>`).join(''):'<p class="small">Nothing has happened yet.</p>';logDirty=false;}
function drainEvents(){if(!S||!S.events.length)return;for(const e of S.events)logs.push(e);S.events.length=0;if(logs.length>600)logs=logs.slice(-500);logDirty=true;}
function refreshBook(force){if(!bookOpen)return;const id=CHAPTERS[chapter].id;
 if(id==='autopsy')updateAutopsy();else if(id==='atlas'){if(force)renderAtlas();if(logDirty||force)renderLog();}}

// ---------- listen: sound made only from what the specimen does ----------
let AC=null,master=null,listening=false,noiseBuf=null,prevFired=0,prevBroken=0;
function startAudio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;AC=new A();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
  const n=Math.round(AC.sampleRate*0.25);noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=H(i*0.173,7.31)*2-1;}
 if(AC.state==='suspended')AC.resume();return true;}
function thump(level){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
 o.type='sine';o.frequency.setValueAtTime(62,t);o.frequency.exponentialRampToValueAtTime(34,t+0.22);
 gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(0.05+0.5*level,t+0.012);gn.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
 o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.35);}
function crackle(n){if(!AC||!noiseBuf)return;const t=AC.currentTime,src=AC.createBufferSource(),bp=AC.createBiquadFilter(),gn=AC.createGain();
 src.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=1400+Math.min(n,40)*40;bp.Q.value=1.4;
 gn.gain.setValueAtTime(Math.min(0.5,0.05+n*0.02),t);gn.gain.exponentialRampToValueAtTime(0.0001,t+0.05+Math.min(n,30)*0.006);
 src.connect(bp);bp.connect(gn);gn.connect(master);src.start(t,H(t,1.7)*0.15);src.stop(t+0.3);}
function listenFrame(){if(!listening||!S)return;const o=S;
 const fired=o.ring[(o.ringPos-1+o.ring.length)%o.ring.length];
 // a heartbeat is a wave rolling across the body: follow its rise against the specimen's own baseline
 if(armed&&aFast>aSlow*1.5+1.5){armed=false;thump(clamp((aFast/(aSlow+0.5)-1)/2.5,0.15,1));}
 else if(!armed&&aFast<aSlow*1.1+0.5)armed=true;
 const b=o.cnt.broken;if(b>prevBroken){pendBreak+=b-prevBroken;prevBroken=b;}
 const now=performance.now();if(pendBreak>0&&now-lastCrackle>60){crackle(pendBreak);pendBreak=0;lastCrackle=now;}}
let aFast=0,aSlow=0,armed=true,pendBreak=0,lastCrackle=0;

// ---------- it lives while you are away ----------
let awayAt=0,catching=false;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){awayAt=performance.now();return;}
 if(!awayAt||!S||!running||catching||P.awayMax<=0){awayAt=0;return;}
 const secs=Math.min(P.awayMax,(performance.now()-awayAt)/1000);awayAt=0;if(secs<1)return;
 const o=S,b0=o.cnt.broken,n0=o.cnt.necro,r0=o.cnt.formed,frames=Math.round(secs/P.dt);let done=0;catching=true;
 const chunk=()=>{if(S!==o){catching=false;return;}const end=Math.min(frames,done+45);for(;done<end;done++)advance();
  if(done<frames){setTimeout(chunk,0);return;}catching=false;prevBroken=o.cnt.broken;
  const tb=o.cnt.broken-b0,tn=o.cnt.necro-n0,tr=o.cnt.formed-r0,parts=[];
  if(tb)parts.push(`${tb} fibers tore`);if(tn)parts.push(`${tn} nodes died`);if(tr)parts.push(`${tr} new fibers grew`);
  ev(`While you were away (${secs.toFixed(0)} s): ${parts.length?parts.join(', '):'it waited'}.`);awayNote=performance.now();};
 chunk();});
let awayNote=0;

// ---------- contamination: the pathology does not stay on the slide ----------
const IC=$('infect'),ictx=IC.getContext('2d'),vigC=document.createElement('canvas');
let infection=0,hyphae=[],hId=0,margIdx=0,margText='',margT=0,prevInfB=0;
const MARGINALIA=[[0.12,'The specimen appears to respond to being observed.'],[0.22,'The fibers are not where I left them.'],
 [0.32,'I have begun to doubt the earlier figures.'],[0.42,'Something is growing on the glass, not in the dish.'],
 [0.52,'It is no longer clear which side of the lens the pathology is on.'],[0.62,'The atlas has no page for this.'],
 [0.74,'I am no longer certain which of us is being examined.'],[0.88,'The plate is the specimen now.']];
function infectTarget(){if(!feat)return 0;return clamp(0.45*feat.broken+0.7*feat.necro+0.35*feat.frag+0.25*feat.strain+0.15*feat.rewire+(cls&&cls.kind==='anomaly'?0.25:0),0,1);}
function sizeInfect(){const old=document.createElement('canvas');old.width=IC.width;old.height=IC.height;if(IC.width)old.getContext('2d').drawImage(IC,0,0);
 IC.width=Math.round(W*DPR);IC.height=Math.round(HH*DPR);ictx.setTransform(1,0,0,1,0,0);if(old.width)ictx.drawImage(old,0,0,old.width,old.height,0,0,IC.width,IC.height);
 vigC.width=Math.max(1,Math.round(W/2));vigC.height=Math.max(1,Math.round(HH/2));const v=vigC.getContext('2d'),gr=v.createRadialGradient(vigC.width/2,vigC.height/2,Math.min(vigC.width,vigC.height)*0.32,vigC.width/2,vigC.height/2,Math.max(vigC.width,vigC.height)*0.72);
 gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(70,8,4,0.85)');v.fillStyle=gr;v.fillRect(0,0,vigC.width,vigC.height);}
function clearInfect(){ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,IC.width,IC.height);infection=0;hyphae=[];margIdx=0;margText='';prevInfB=S?S.cnt.broken:0;}
function spawnHypha(x,y,a){if(hyphae.length>=30+230*infection)return;hId++;hyphae.push({x,y,a,id:hId,life:300+H(hId,4.1)*700});}
function infectFrame(dtf){const o=S;if(!o||!SZ||P.contagion<=0)return;
 const tgt=infectTarget();if(tgt>infection)infection=Math.min(tgt,infection+dtf*0.012*P.contagion);else infection=Math.max(0,infection-dtf*0.0015);
 // fresh tears seed growth on the glass
 if(o.cnt.broken>prevInfB){let budget=3;
  for(let f=o.F-1;f>=0&&budget>0;f--){if(o.alive[f]||o.broke[f]<o.time-dtf*1.5)continue;const a=o.fa[f],b=o.fb[f];if(SZ[a]<0||SZ[b]<0)continue;
   if(H(f*0.91,o.tick*0.37)<(0.06+0.6*infection)*P.contagion){const x=(SX[a]+SX[b])/2,y=(SY[a]+SY[b])/2;spawnHypha(x,y,Math.atan2(y-view.cy,x-view.cx)+(H(f,2.2)-0.5));}budget--;}
  prevInfB=o.cnt.broken;}
 if(infection>0.45&&H(frameN*0.13,9.7)<(infection-0.45)*0.04*P.contagion){const e=H(frameN,3.3),edge=Math.floor(H(frameN,5.5)*4);
  const x=edge===0?0:edge===1?W:e*W,y=edge===2?0:edge===3?HH:e*HH;spawnHypha(x,y,Math.atan2(view.cy-y,view.cx-x)+(H(frameN,1.1)-0.5));}
 if(!hyphae.length)return;
 const sp=(0.25+0.9*infection)*P.contagion;
 ictx.setTransform(DPR,0,0,DPR,0,0);ictx.beginPath();const spores=[];
 for(let k=hyphae.length-1;k>=0;k--){const h=hyphae[k];const x0=h.x,y0=h.y;
  h.a+=(H(h.id*1.3,frameN*0.37)-0.5)*0.5;h.x+=Math.cos(h.a)*sp;h.y+=Math.sin(h.a)*sp;h.life--;
  ictx.moveTo(x0,y0);ictx.lineTo(h.x,h.y);
  if(H(h.id,frameN*1.7)<0.006*(0.5+infection))spawnHypha(h.x,h.y,h.a+(H(h.id,frameN)<0.5?-0.7:0.7));
  if(H(h.id*2.9,frameN*0.53)<0.015)spores.push(h.x,h.y);
  if(h.life<=0||h.x<-10||h.y<-10||h.x>W+10||h.y>HH+10)hyphae.splice(k,1);}
 ictx.strokeStyle=themeName==='paper'?'rgba(58,22,14,0.55)':'rgba(128,32,22,0.55)';ictx.lineWidth=0.7;ictx.lineCap='round';ictx.stroke();
 if(spores.length){ictx.fillStyle=themeName==='paper'?'rgba(58,22,14,0.7)':'rgba(150,40,26,0.7)';ictx.beginPath();for(let k=0;k<spores.length;k+=2)ictx.rect(spores[k]-0.8,spores[k+1]-0.8,1.6,1.6);ictx.fill();}
 while(margIdx<MARGINALIA.length&&infection>=MARGINALIA[margIdx][0]){margText=MARGINALIA[margIdx][1];margT=performance.now();ev(`Marginal note: “${margText}”`);margIdx++;}}
const ROTG='ǝɐıʇɹ∅†·░ɯ';
function rot(str,salt){if(infection<0.2||!str)return str;const p=(infection-0.2)*0.12,tb=Math.floor(performance.now()/700);let out='';
 for(let i=0;i<str.length;i++){const c=str[i];out+=(c!==' '&&H(i*1.7+salt,tb*0.31)<p)?ROTG[Math.floor(H(i+salt,tb)*ROTG.length)%ROTG.length]:c;}return out;}
function drawContamination(){if(infection<=0.01)return;
 const pulse=clamp(aFast/(aSlow+1)-1,0,1);ctx.globalAlpha=Math.min(0.85,infection*(0.45+0.4*pulse));ctx.drawImage(vigC,0,0,W,HH);ctx.globalAlpha=1;
 if(margText&&performance.now()-margT<7000){const fade=1-Math.max(0,(performance.now()-margT-5500)/1500);ctx.globalAlpha=fade;ctx.fillStyle=TH.accent;
  ctx.font='italic 12.5px "Iowan Old Style",Baskerville,Georgia,serif';const t=rot(margText,5);ctx.fillText(t,(W-ctx.measureText(t).width)/2,topH+40);ctx.globalAlpha=1;}}

// ---------- wiring ----------
$('bPrev').addEventListener('click',()=>turn(-1));$('bNext').addEventListener('click',()=>turn(1));
const toggleBook=()=>{bookOpen=!bookOpen;layout();if(bookOpen)buildChapter();};
$('bToggle').addEventListener('click',toggleBook);$('btitle').addEventListener('click',toggleBook);
document.querySelectorAll('#tabbar .tab').forEach(b=>b.addEventListener('click',()=>{if(deckOpen&&deckTab===b.dataset.tab)deckOpen=false;else{deckOpen=true;deckTab=b.dataset.tab;}buildRows();layout();}));
$('pauseB').addEventListener('click',()=>{running=!running;buildRows();});
window.addEventListener('resize',layout);
let uiT=0,panT=0;
function loop(ts){requestAnimationFrame(loop);
 if(S&&(running||stepOnce)&&!catching){advance();{const o=S,fd=o.ring[(o.ringPos-1+o.ring.length)%o.ring.length];aFast+=(fd-aFast)*0.35;aSlow+=(fd-aSlow)*0.02;}listenFrame();infectFrame(P.dt);stepOnce=false;if(frameN%10===0&&LAY.core&&plateStyle==='anatomical')updateCoreHull();if(frameN%20===0)chooseLabels();}
 render();drainEvents();
 if(ts-uiT>250){uiT=ts;updateHead();}
 if(ts-panT>500){panT=ts;refreshBook(false);}}
function boot(){const now=Date.now();seedVal=1+Math.floor(H((now%100003)*0.0137,(now/997)%1009)*99990);camFromOrbit();loadAtlas();setTheme('dark');buildRows();layout();regrow();project();chooseLabels();requestAnimationFrame(loop);}
try{boot();}catch(err){const h=$('hudtxt');if(h)h.textContent='Error: '+err.message;throw err;}

</script>
